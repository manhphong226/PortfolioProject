<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Trang công khai — Portfolio</title>
  <script src="js/public-styles.js"></script>
</head>
<body>
  <div id="app"></div>

  <noscript>
    <p style="padding:40px;text-align:center;font-family:sans-serif">
      Trang này cần JavaScript để hiển thị nội dung.
    </p>
  </noscript>

  <script src="js/public-data.js"></script>
  <script src="js/public-render.js"></script>
  <script src="js/public-runtime.js"></script>
  <script>
    (function () {
      if (!window.PortfolioRender) return;

      var style = document.createElement("style");
      style.id = "portfolio-styles";
      style.textContent = window.PORTFOLIO_CSS || "";
      document.head.appendChild(style);

      window.PortfolioRender.mount(window.PORTFOLIO_DEFAULT_DATA || {});
      if (window.PORTFOLIO_RUNTIME) {
        try { new Function(window.PORTFOLIO_RUNTIME)(); } catch (e) { console.error(e); }
      }
    })();
  </script>
</body>
</html>
